<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Xability product surfaces</title>
  <desc id="desc">Representative product surfaces based on current Xability client-facing workflows: wallet, calendar, asset library, social connections, reporting, approvals and campaigns.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a42"/><stop offset="1" stop-color="#0b285e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9351a"/><stop offset="1" stop-color="#faaa68"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".22"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.cap{font-size:12px;letter-spacing:2px;fill:#faaa68;font-weight:700}.head{font-size:27px;fill:#fff;font-weight:800}.sub{font-size:13px;fill:#9fb0cc}.card{fill:#fff;stroke:#dfe6f0;stroke-width:1}.ink{fill:#07142e}.muted{fill:#7d8798}.orange{fill:#ef4b00}.teal{fill:#028393}.tiny{font-size:10px}.small{font-size:12px}.med{font-size:15px;font-weight:700}.big{font-size:23px;font-weight:800}.line{stroke:#e9edf3;stroke-width:1}.chip{fill:#f7f4ec;stroke:#e1e5eb;stroke-width:1}.soft{fill:#f8f5ee}.navy{fill:#091f4d}.green{fill:#19b887}.red{fill:#f9351a}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="55" r="155" fill="#028393" opacity=".12"/><circle cx="1050" cy="40" r="95" fill="#f9351a" opacity=".09"/>
  <text x="50" y="52" class="t cap">XABILITY / LIVE PRODUCT SURFACES</text>
  <text x="50" y="87" class="t head">One operating layer. Six customer-facing workflows.</text>
  <text x="50" y="112" class="t sub">Representative views based on current Xability client flows shown in product captures.</text>

  <!-- Wallet -->
  <g transform="translate(45 145)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">WALLET &amp; BILLING</text>
    <text x="24" y="76" class="t big ink">Wallet &amp; Credits</text>
    <text x="24" y="97" class="t small muted">Subscription balance and usage by campaign</text>
    <g transform="translate(24 118)">
      <rect width="94" height="56" rx="13" fill="#fff8f1" stroke="#ffd7c7"/><text x="12" y="22" class="t tiny muted">MONTHLY</text><text x="12" y="44" class="t med orange">Credits</text>
      <rect x="104" width="94" height="56" rx="13" fill="#f4fbfa" stroke="#cfe9e5"/><text x="116" y="22" class="t tiny muted">RESERVED</text><text x="116" y="44" class="t med teal">By work</text>
      <rect x="208" width="94" height="56" rx="13" fill="#f6f8fc" stroke="#dce3ef"/><text x="220" y="22" class="t tiny muted">AVAILABLE</text><text x="220" y="44" class="t med ink">To use</text>
      <rect y="76" width="302" height="10" rx="5" fill="#e7eaf0"/><rect y="76" width="212" height="10" rx="5" fill="url(#accent)"/>
      <text y="108" class="t tiny muted">Payment history · invoices · campaign usage</text>
    </g>
  </g>

  <!-- Calendar -->
  <g transform="translate(425 145)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">CONTENT CALENDAR</text>
    <text x="24" y="76" class="t big ink">September 2026</text>
    <text x="24" y="97" class="t small muted">Approved · Published · Scheduled</text>
    <g transform="translate(24 116)">
      <text x="4" y="11" class="t tiny muted">SUN</text><text x="47" y="11" class="t tiny muted">MON</text><text x="91" y="11" class="t tiny muted">TUE</text><text x="135" y="11" class="t tiny muted">WED</text><text x="181" y="11" class="t tiny muted">THU</text><text x="227" y="11" class="t tiny muted">FRI</text><text x="270" y="11" class="t tiny muted">SAT</text>
      <g class="t tiny muted">
        <rect y="21" width="302" height="100" rx="13" fill="#fbfbfc" stroke="#edf0f5"/>
        <text x="8" y="42">1</text><text x="51" y="42">2</text><text x="95" y="42">3</text><text x="139" y="42">4</text><text x="183" y="42">5</text><text x="227" y="42">6</text><text x="271" y="42">7</text>
        <text x="8" y="70">8</text><text x="51" y="70">9</text><text x="91" y="70">10</text><text x="135" y="70">11</text><text x="179" y="70">12</text><text x="223" y="70">13</text><text x="267" y="70">14</text>
        <text x="4" y="99">15</text><text x="47" y="99">16</text><text x="91" y="99">17</text><text x="135" y="99">18</text><text x="179" y="99">19</text><text x="223" y="99">20</text><text x="267" y="99">21</text>
        <circle cx="16" cy="47" r="4" class="green"/><circle cx="104" cy="75" r="4" class="teal"/><circle cx="192" cy="104" r="4" fill="#8058ef"/>
      </g>
    </g>
  </g>

  <!-- Library -->
  <g transform="translate(805 145)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">ASSET LIBRARY</text>
    <text x="24" y="76" class="t big ink">Brand Assets</text>
    <text x="24" y="97" class="t small muted">Logos · products · references · videos</text>
    <rect x="24" y="116" width="102" height="32" rx="16" fill="#ef4b00"/><text x="42" y="137" class="t small" fill="#fff" font-weight="700">+ Upload asset</text>
    <g transform="translate(24 164)">
      <rect width="58" height="25" rx="12" class="chip"/><text x="17" y="17" class="t tiny muted">All</text>
      <rect x="66" width="58" height="25" rx="12" class="chip"/><text x="80" y="17" class="t tiny muted">Logo</text>
      <rect x="132" width="65" height="25" rx="12" class="chip"/><text x="143" y="17" class="t tiny muted">Product</text>
      <rect x="205" width="70" height="25" rx="12" class="chip"/><text x="215" y="17" class="t tiny muted">Reference</text>
      <rect y="38" width="302" height="26" rx="8" fill="#f7f4ec"/><rect x="7" y="44" width="30" height="14" rx="4" class="navy"/><text x="48" y="56" class="t tiny ink">HorizonX brand library</text>
    </g>
  </g>

  <!-- Social -->
  <g transform="translate(45 425)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">SOCIAL CONNECTIONS</text>
    <text x="24" y="76" class="t big ink">Connected Pages</text>
    <text x="24" y="97" class="t small muted">Facebook &amp; Instagram access in one place</text>
    <rect x="24" y="116" width="302" height="65" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="52" cy="149" r="18" fill="#1877f2"/><text x="47" y="156" class="t big" fill="#fff">f</text>
    <text x="82" y="140" class="t med ink">Business Page</text><text x="82" y="160" class="t small green">● Connected</text>
    <rect x="24" y="194" width="302" height="34" rx="17" fill="#1877f2"/><text x="103" y="216" class="t small" fill="#fff" font-weight="700">Connect another page</text>
  </g>

  <!-- Reports -->
  <g transform="translate(425 425)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">PERFORMANCE REPORTS</text>
    <text x="24" y="76" class="t big ink">Monthly Performance</text>
    <text x="24" y="97" class="t small muted">Request a report from published activity</text>
    <rect x="24" y="116" width="160" height="34" rx="9" fill="#fff" stroke="#d9dee8"/><text x="39" y="138" class="t small ink">September 2026</text>
    <rect x="194" y="116" width="132" height="34" rx="17" fill="#ef4b00"/><text x="218" y="138" class="t small" fill="#fff" font-weight="700">Generate report</text>
    <g transform="translate(24 168)"><rect width="302" height="60" rx="12" fill="#f8fafc" stroke="#e4e9f1"/><line x1="15" y1="45" x2="287" y2="45" class="line"/><rect x="28" y="24" width="22" height="21" rx="4" fill="#faaa68"/><rect x="68" y="13" width="22" height="32" rx="4" class="teal"/><rect x="108" y="28" width="22" height="17" rx="4" fill="#6bab9e"/><rect x="148" y="7" width="22" height="38" rx="4" class="red"/><rect x="188" y="19" width="22" height="26" rx="4" fill="#faaa68"/><rect x="228" y="11" width="22" height="34" rx="4" class="teal"/></g>
  </g>

  <!-- Approvals -->
  <g transform="translate(805 425)" filter="url(#shadow)">
    <rect width="350" height="250" rx="24" class="card"/>
    <rect width="350" height="42" rx="24" class="soft"/><rect y="26" width="350" height="16" class="soft"/>
    <circle cx="24" cy="21" r="5" class="red"/><circle cx="42" cy="21" r="5" fill="#faaa68"/><circle cx="60" cy="21" r="5" class="teal"/>
    <text x="84" y="25" class="t tiny muted">APPROVALS &amp; CAMPAIGNS</text>
    <text x="24" y="76" class="t big ink">Approval Queue</text>
    <text x="24" y="97" class="t small muted">Content only moves after customer approval</text>
    <rect x="24" y="116" width="302" height="56" rx="15" fill="#f4fbfa" stroke="#cfe9e5"/><circle cx="49" cy="144" r="11" class="green"/><path d="M44 144l4 4 8-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="139" class="t med ink">Nothing pending</text><text x="72" y="157" class="t tiny muted">Approval state is visible to the client</text>
    <rect x="24" y="186" width="144" height="38" rx="12" fill="#fff8f1" stroke="#ffd7c7"/><text x="38" y="210" class="t small orange" font-weight="700">Content campaigns</text>
    <rect x="178" y="186" width="148" height="38" rx="12" fill="#f6f8fc" stroke="#dce3ef"/><text x="197" y="210" class="t small ink" font-weight="700">Paid campaigns</text>
  </g>

  <text x="50" y="720" class="t small" fill="#9fb0cc">Client command center · approvals · campaigns · calendar · asset library · social connections · reports · wallet &amp; credits</text>
  <text x="1150" y="720" text-anchor="end" class="mono tiny" fill="#faaa68">XABILITY.HORIZONX.SITE</text>
</svg>