name: One-time game touch start

on:
  push:
    paths:
      - '.github/workflows/game-start-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make whole game area startable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="canvas.addEventListener('pointerdown',jump);"
          new="canvas.parentElement?.addEventListener('pointerdown',jump);"
          if old not in s:
              raise SystemExit('game pointer handler not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/game-start-touch.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/game-start-touch.yml
          git commit -m 'Start runner from any tap on game area'
          git push
