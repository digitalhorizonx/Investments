name: One-time game and currency patch

on:
  push:
    paths:
      - '.github/workflows/game-currency-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace('speed:6.2,frame:0','speed:7.35,frame:0')
          text = text.replace('S.speed=6.2;S.frame=0','S.speed=7.35;S.frame=0')
          text = text.replace('S.score+=.7+S.speed*.018;S.speed=Math.min(12.2,6.2+S.score/480);','S.score+=.74+S.speed*.019;S.speed=Math.min(13.6,7.35+S.score/560);')
          app.write_text(text,encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          marker = '<script src="/app.js"></script>'
          replacement = '<script src="/app.js"></script>\n<script src="/currency.js"></script>'
          if '/currency.js' not in html:
              if marker not in html:
                  raise SystemExit('app.js script marker not found')
              html = html.replace(marker,replacement)
          idx.write_text(html,encoding='utf-8')
          PY
          rm .github/workflows/game-currency-update.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html .github/workflows/game-currency-update.yml
          git commit -m 'Tune runner speed and enable display currency selector'
          git push
