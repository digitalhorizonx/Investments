name: One-time runner tuning

on:
  push:
    paths:
      - '.github/workflows/game-tuning.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          replacements = {
            'speed:7.35,frame:0': 'speed:8.35,frame:0',
            'S.speed=7.35;S.frame=0': 'S.speed=8.35;S.frame=0',
            'S.next=S.frame+80+Math.floor(Math.random()*80)': 'S.next=S.frame+52+Math.floor(Math.random()*58)',
            'S.frame++;S.score+=.74+S.speed*.019;S.speed=Math.min(13.6,7.35+S.score/560);': 'S.frame++;S.score+=.80+S.speed*.020;S.speed=Math.min(14.8,8.35+S.score/600);'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit('Missing expected game tuning pattern: ' + old)
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/game-tuning.yml
      - name: Commit tuned game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/game-tuning.yml
          git commit -m 'Increase runner speed and obstacle density'
          git push
